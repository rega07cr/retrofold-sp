name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Android platform + NDK + CMake (runner SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Fetch mGBA sources (tarball ufficiale 0.10.5)
        run: |
          rm -rf app/src/main/cpp/mgba
          mkdir -p app/src/main/cpp/mgba
          curl -sL -o /tmp/mgba.tgz https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz
          tar -xzf /tmp/mgba.tgz -C /tmp
          mv /tmp/mgba-0.10.5 app/src/main/cpp/mgba
          rm -f /tmp/mgba.tgz
          test -f app/src/main/cpp/mgba/CMakeLists.txt

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RetroFold-SP.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroFold-SP-apk
          path: dist/RetroFold-SP.apk
          if-no-files-found: error
